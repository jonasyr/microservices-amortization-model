name: Reproduktion

# Manuell startbar: rechnet den vollständigen Lauf (ca. 5 min) und prüft,
# dass alle Ergebnisdaten byte-identisch mit dem veröffentlichten Stand sind.
on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run_all
      - run: sha256sum -c SHA256SUMS
