name: Reproduktion

# Manuell startbar: rechnet den vollständigen Lauf (ca. 6–8 min je System) unter Linux und
# Windows und prüft mit src.verify: veröffentlichte Daten gegen SHA256SUMS, frische Daten gegen
# die veröffentlichten (Toleranz 1e-9) und die Tabellen und Zahlen der Arbeit Zeichen für Zeichen.
on:
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.verify
