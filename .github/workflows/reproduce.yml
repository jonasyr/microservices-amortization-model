name: Reproduktion

# Manuell startbar: rechnet den vollständigen Lauf (ca. 6–8 min je System).
# Linux (Referenz): src.verify und zusätzlich byte-identisch gegen SHA256SUMS.
# Windows: src.verify (Tabellen und Zahlen identisch, Rohdaten innerhalb der Toleranz).
on:
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.verify
      - name: Byte-identisch zum veröffentlichten Stand (Referenzplattform)
        if: runner.os == 'Linux'
        run: sed 's#output/data/#data/#' SHA256SUMS | (cd output/_verify && sha256sum -c -)
